# Sao chep toan bo file nay thanh config.yaml; sau do doi API keys.
server:
  host: 127.0.0.1
  port: 8000
  api_key: change-this-key
  admin_key: change-admin-key
  upload_concurrency: 4
  upload_timeout_seconds: 60
  max_body_mb: 26
  max_file_mb: 25
queue:
  max_pending: 200
  poll_seconds: 0.25
  max_attempts: 2
  job_timeout_seconds: 300
  startup_timeout_seconds: 900
  shutdown_seconds: 15
  max_restarts: 5
storage:
  root: data
  min_free_disk_mb: 1024
  max_pixels: 12000000
  max_edge: 1600
  max_pdf_pages: 30
  max_crops_per_page: 50
  retention_days: 30
  cleanup_dry_run: true
models:
  yolo_path: yolo11n.pt
  yolo_imgsz: 640
  confidence: 0.25
  ocr_lang: vi
  ocr_version: PP-OCRv3
  ocr_det_dir: null
  ocr_rec_dir: null
  cpu_threads: 2
  max_worker_rss_mb: 8192
  min_free_gpu_mb: 512
  release_cache_after_job: true
gpu_slots:
  '0': 1
  '1': 1
  '2': 1
  '3': 1
workers:
- id: worker_1
  host: 127.0.0.1
  port: 9001
  device: gpu
  gpu_id: 0
- id: worker_2
  host: 127.0.0.1
  port: 9002
  device: gpu
  gpu_id: 1
- id: worker_3
  host: 127.0.0.1
  port: 9003
  device: gpu
  gpu_id: 2
- id: worker_4
  host: 127.0.0.1
  port: 9004
  device: gpu
  gpu_id: 3
